<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2d4a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="观粟工作台">
<meta name="description" content="宁化谷物艺术中心（观粟民宿）主理人一体化工作台：日程·短视频·民宿·米酒·擂茶·健身·英语·复盘·IP人设。">
<link rel="manifest" href="manifest-studio.json">
<link rel="apple-touch-icon" href="icons/studio-192.png">
<link rel="icon" type="image/png" href="icons/studio-192.png">
<title>谷物艺术中心·观粟民宿｜主理人工作台</title>
<style>
:root {
  /* 主理人深度版：深绿主调 + 暖灰背景，护眼耐看 */
  --sidebar-bg: #2d4a3e;          /* 深绿侧栏 */
  --sidebar-text: #d8e2dc;        /* 侧栏文字 */
  --sidebar-text-active: #ffffff;
  --sidebar-active: #3d6650;      /* 选中项高亮 */
  --sidebar-group: rgba(255,255,255,.32);
  --main-bg: #f0eee6;             /* 暖灰米底（不是亮米黄） */
  --card: #ffffff;
  --card-soft: #faf8f3;           /* 二级卡片 */
  --accent: #5a8a6b;              /* 苔绿（比之前的鲜绿更沉稳） */
  --accent-light: #e3ede5;
  --text: #1f2a26;                /* 深字主 */
  --text-2: #4d5a55;              /* 次级 */
  --muted: #97a39d;
  --border: #e3dfd3;              /* 暖灰描边 */
  --warn: #c98a2b;
  --danger: #b35c54;
  --c-tea: #7d9d54;
  --c-video: #c2714e;
  --c-bnb: #3f9d8f;
  --c-wine: #a86270;
  --c-life: #5a89b5;
  /* 头部右侧小工具按钮色 */
  --icon-btn: #4a6555;
  --icon-btn-bg: rgba(255,255,255,.55);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--text); background:#e9e5de; }
.app { display:flex; min-height:100vh; }

/* ===== 左侧科目式导航 ===== */
.sidebar {
  width:206px; background:var(--sidebar-bg); color:var(--sidebar-text);
  position:fixed; left:0; top:0; bottom:0; z-index:100;
  display:flex; flex-direction:column; padding:20px 12px 16px;
  transition:transform .3s; overflow-y:auto;
  font-size:13px;
}
.profile { display:flex; align-items:center; gap:10px; padding:4px 6px 18px; border-bottom:1px solid rgba(255,255,255,.08); margin-bottom:10px; }
.avatar { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#7d9d54,#5a8a6b); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.profile-name { font-size:13px; font-weight:700; color:#fff; line-height:1.2; }
.profile-sub { font-size:10px; color:rgba(255,255,255,.5); margin-top:3px; }
.nav-group { font-size:11px; color:var(--sidebar-group); padding:14px 10px 6px; letter-spacing:1.5px; }
.nav-item { display:flex; align-items:center; gap:11px; width:100%; padding:9px 12px; border-radius:10px; color:var(--sidebar-text); background:none; border:none; font-size:13px; cursor:pointer; text-align:left; transition:all .2s; margin-bottom:2px; }
.nav-item:hover { background:rgba(255,255,255,.08); color:#fff; }
.nav-item.active { background:var(--sidebar-active); color:var(--sidebar-text-active); font-weight:600; }
.nav-item .ic { width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.nav-item.active .ic { background:rgba(255,255,255,.95); color:var(--sidebar-bg); }
.nav-item .tag { margin-left:auto; font-size:9px; background:#c2714e; padding:2px 7px; border-radius:7px; color:#fff; font-weight:600; }
.sidebar-footer { margin-top:auto; padding-top:12px; font-size:10px; color:rgba(255,255,255,.3); text-align:center; }

/* ===== 主区（参考图右侧） ===== */
.main { flex:1; margin-left:206px; min-height:100vh; display:flex; flex-direction:column; background:var(--main-bg); }
/* 头部：左侧面包屑+大标题 / 右侧工具按钮 */
.main-header { background:var(--card); padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10; }
.menu-btn { display:none; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text); }
.breadcrumb { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
.back-arr { color:var(--muted); font-size:16px; cursor:pointer; }
.h-title { font-size:15px; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.h-sub { font-size:11px; color:var(--muted); margin-left:8px; }
.header-tools { display:flex; align-items:center; gap:6px; }
.h-btn { width:34px; height:34px; border-radius:9px; background:transparent; border:none; color:var(--icon-btn); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.h-btn:hover { background:var(--accent-light); }
.h-btn svg { width:18px; height:18px; }
.scroll { flex:1; padding:18px 22px 50px; overflow-y:auto; }

/* ===== 卡片（参考图大圆角白卡） ===== */
.card { background:var(--card); border-radius:16px; padding:18px 20px; margin-bottom:14px; box-shadow:0 2px 6px rgba(40,50,40,.04); }
.card-t { font-size:15px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card-t .lft { display:flex; align-items:center; gap:8px; }
.desc { font-size:12px; color:var(--muted); line-height:1.7; }

/* ===== 标题卡（参考图"生字学习"卡） ===== */
.title-card { background:linear-gradient(135deg,#faf6ed,#f0eee6); border:1px solid var(--border); border-radius:16px; padding:20px 22px; margin-bottom:14px; display:flex; align-items:center; gap:16px; }
.title-card .ic-box { width:48px; height:48px; border-radius:12px; background:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.title-card .t-info { flex:1; }
.title-card .t-info h2 { font-size:18px; font-weight:800; color:var(--text); }
.title-card .t-info p { font-size:12px; color:var(--text-2); margin-top:3px; }
.title-card .t-tag { background:var(--accent); color:#fff; font-size:11px; font-weight:600; padding:5px 12px; border-radius:12px; }
.quote-band { background:#f5ede0; border-radius:12px; padding:10px 14px; font-size:12px; color:#7a5c2a; margin-bottom:14px; line-height:1.7; }

/* ===== Banner ===== */
.banner { background:linear-gradient(135deg,#3d6650 0%,#5a8a6b 100%); color:#fff; border-radius:16px; padding:22px; margin-bottom:14px; position:relative; overflow:hidden; }
.banner::after { content:''; position:absolute; right:-40px; top:-40px; width:160px; height:160px; background:rgba(255,255,255,.1); border-radius:50%; }
.banner-top { display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
.banner-hi { font-size:18px; font-weight:800; margin-bottom:6px; }
.banner-quote { font-size:13px; opacity:.9; margin-bottom:12px; line-height:1.7; }
.banner-meta { font-size:11px; opacity:.7; }
.ring-wrap { position:relative; width:72px; height:72px; flex-shrink:0; }
.ring-num { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:17px; font-weight:800; }
.ring-num small { font-size:9px; font-weight:400; opacity:.8; }

/* ===== 优先级清单 ===== */
.pr-item { display:flex; align-items:flex-start; gap:11px; padding:9px 12px; border-radius:10px; background:var(--card-soft); margin-bottom:7px; }
.pr-item.done { opacity:.55; }
.pr-item.done .pr-text { text-decoration:line-through; }
.pr-badge { flex-shrink:0; font-size:10px; font-weight:700; padding:2px 8px; border-radius:8px; margin-top:2px; color:#fff; }
.P0 { background:#b35c54; } .P1 { background:#c98a2b; } .P2 { background:#95a5a6; }
.pr-text { flex:1; font-size:13px; line-height:1.55; }
.pr-check { width:22px; height:22px; border-radius:6px; border:2px solid #cfd8dc; background:#fff; cursor:pointer; flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
.pr-check.on { background:var(--accent); border-color:var(--accent); }

/* ===== 28天进度条 ===== */
.days-strip { display:flex; flex-wrap:wrap; gap:6px; }
.days-strip .d { width:30px; height:30px; border-radius:8px; background:#eef2ef; color:#adb8b0; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:default; }
.days-strip .d.done { background:var(--accent); color:#fff; }
.days-strip .d.cur { outline:2px solid var(--accent); outline-offset:1px; color:var(--accent); font-weight:800; }

/* ===== 指令区 ===== */
.cmd-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
.cmd-btn { border:1px solid var(--border); background:#fff; border-radius:12px; padding:11px 14px; text-align:left; cursor:pointer; transition:all .2s; }
.cmd-btn:hover { border-color:var(--accent); background:var(--accent-light); }
.cmd-btn .t { font-size:13px; font-weight:700; margin-bottom:3px; }
.cmd-btn .s { font-size:11px; color:var(--muted); }

/* ===== 表单 ===== */
input[type=text],input[type=number],input[type=date],select,textarea { border:1px solid var(--border); border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; outline:none; background:#fff; color:var(--text); }
input:focus,select:focus,textarea:focus { border-color:var(--accent); }
textarea { width:100%; resize:vertical; line-height:1.7; }
.btn { border:none; background:var(--accent); color:#fff; font-size:13px; font-weight:600; padding:9px 18px; border-radius:20px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { background:#4a7259; }
.btn.ghost { background:var(--accent-light); color:var(--accent); }
.btn.warn { background:var(--warn); }
.btn.danger { background:var(--danger); }
.btn.sm { padding:6px 14px; font-size:12px; }

/* ===== 任务列表 ===== */
.task-item { display:flex; align-items:center; gap:11px; padding:10px 13px; background:var(--card-soft); border-radius:10px; margin-bottom:7px; }
.task-item.done { opacity:.55; }
.task-item.done .tk-text { text-decoration:line-through; }
.tk-cat { flex-shrink:0; font-size:10px; padding:2px 8px; border-radius:8px; color:#fff; }
.tk-text { flex:1; font-size:13px; line-height:1.5; }
.tk-meta { font-size:10px; color:var(--muted); margin-top:2px; }
.date-group-t { font-size:13px; font-weight:700; color:var(--accent); margin:14px 0 7px; display:flex; align-items:center; gap:8px; }
.date-group-t .cnt { font-size:11px; color:var(--muted); font-weight:400; }

/* ===== 视频卡片 ===== */
.video-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
.vcard { border:1px solid var(--border); border-radius:14px; padding:15px; cursor:pointer; transition:all .2s; background:#fff; }
.vcard:hover { box-shadow:0 4px 12px rgba(45,79,62,.1); }
.vcard.cur { border-color:var(--c-video); background:#fdf6f1; }
.vcard-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.vday { width:30px; height:30px; border-radius:50%; background:#fbeee7; color:var(--c-video); font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.vday.done { background:var(--accent); color:#fff; }
.vbiz { font-size:10px; padding:2px 8px; border-radius:8px; background:#f1f4f2; color:var(--muted); }
.vtitle { font-size:15px; font-weight:700; margin-bottom:5px; }
.vshot { font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:8px; }
.vdetail { border-top:1px dashed var(--border); margin-top:10px; padding-top:10px; }
.vblock { background:var(--card-soft); border-radius:8px; padding:10px 12px; margin-bottom:8px; position:relative; }
.vblock .lb { font-size:10px; color:var(--muted); margin-bottom:4px; }
.vblock .tx { font-size:12px; line-height:1.6; padding-right:48px; }
.copy-btn { position:absolute; top:8px; right:8px; border:1px solid var(--border); background:#fff; color:var(--accent); font-size:11px; padding:3px 9px; border-radius:8px; cursor:pointer; }

/* ===== 清单 ===== */
.chk { display:flex; align-items:center; gap:11px; padding:9px 12px; background:var(--card-soft); border-radius:10px; margin-bottom:6px; font-size:13px; line-height:1.5; cursor:pointer; }
.chk .box { width:20px; height:20px; border-radius:6px; border:2px solid #cfd8dc; background:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; }
.chk.on { opacity:.6; }
.chk.on .box { background:var(--accent); border-color:var(--accent); }
.chk.on .tx { text-decoration:line-through; }

/* ===== 看板 ===== */
.kb-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px; }
.kb-card { border:1px solid var(--border); border-radius:14px; padding:16px; background:#fff; }
.kb-t { font-size:14px; font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.kb-pct { font-size:12px; color:var(--accent); font-weight:700; }
.price-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
.price-card { border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; background:#fff; }
.price-name { font-size:12px; color:var(--muted); }
.price-num { font-size:22px; font-weight:800; color:var(--c-tea); margin:4px 0; }
.price-desc { font-size:11px; color:var(--muted); line-height:1.5; }

/* ===== 复盘 ===== */
.rev-field { margin-bottom:12px; }
.rev-field label { display:block; font-size:12px; font-weight:700; margin-bottom:5px; }
.rev-field textarea { min-height:60px; font-size:13px; }
.rev-hist { border:1px solid var(--border); border-radius:10px; margin-bottom:7px; overflow:hidden; background:#fff; }
.rev-hist-t { padding:10px 14px; background:var(--card-soft); font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; }
.rev-hist-b { padding:12px 14px; font-size:12px; line-height:1.7; white-space:pre-wrap; border-top:1px solid var(--border); }

/* ===== IP ===== */
.kw-chips { display:flex; flex-wrap:wrap; gap:7px; }
.kw { background:var(--accent-light); color:var(--accent); font-size:12px; font-weight:600; padding:6px 13px; border-radius:14px; }
.style-card { border-left:4px solid var(--accent); background:var(--card-soft); border-radius:8px; padding:13px 16px; margin-bottom:11px; position:relative; }
.style-t { font-size:13px; font-weight:700; margin-bottom:7px; }
.style-c { font-size:12px; line-height:1.8; color:#4a5560; white-space:pre-wrap; padding-right:52px; }

/* ===== 统计小卡 ===== */
.stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:11px; margin-bottom:14px; }
.stat-card { background:#fff; border:1px solid var(--border); border-radius:13px; padding:13px; }
.stat-n { font-size:22px; font-weight:800; color:var(--accent); }
.stat-n small { font-size:12px; color:var(--muted); font-weight:400; }
.stat-l { font-size:11px; color:var(--muted); margin-top:3px; }

/* ===== 财务 ===== */
.fin-row { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; background:var(--card-soft); margin-bottom:6px; font-size:13px; }
.fin-type { font-size:10px; padding:2px 8px; border-radius:8px; color:#fff; }
.fin-in { background:var(--accent); } .fin-out { background:var(--danger); }
.fin-amt { font-weight:700; }
.fin-amt.in { color:var(--accent); } .fin-amt.out { color:var(--danger); }

/* ===== 英语 ===== */
.sent-card { display:flex; align-items:center; gap:12px; padding:12px 15px; border-radius:11px; background:#edf3f9; margin-bottom:8px; }
.sent-en { flex:1; font-size:14px; font-weight:600; color:#2c5f86; line-height:1.5; }
.sent-btn { border:1px solid #bcd4ea; background:#fff; color:#5a89b5; font-size:11px; padding:4px 11px; border-radius:10px; cursor:pointer; flex-shrink:0; }
.sent-btn.on { background:#5a89b5; color:#fff; border-color:#5a89b5; }
.path { display:flex; flex-wrap:wrap; gap:7px; }
.path .p { width:32px; height:32px; border-radius:8px; background:#eef2ef; color:#adb8b0; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; }
.path .p.done { background:var(--accent); color:#fff; }
.path .p.cur { outline:2px solid var(--accent); outline-offset:1px; color:var(--accent); font-weight:800; }

/* ===== Toast / Modal ===== */
.toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px); background:rgba(45,62,50,.92); color:#fff; font-size:13px; padding:10px 22px; border-radius:20px; opacity:0; transition:all .25s; z-index:300; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.modal-mask { position:fixed; inset:0; background:rgba(45,79,62,.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:24px; }
.modal-mask.hide { display:none; }
.modal { background:#fff; border-radius:20px; padding:26px; width:100%; max-width:380px; }
.modal-t { font-size:19px; font-weight:800; text-align:center; margin-bottom:6px; }
.modal-s { font-size:12px; color:var(--muted); text-align:center; margin-bottom:18px; }
.modal .field { margin-bottom:13px; }
.modal label { display:block; font-size:12px; color:var(--muted); margin-bottom:5px; }
.modal input { width:100%; }

/* ===== 响应式 ===== */
.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:99; }
.overlay.show { display:block; }
/* ===== 手机底部Tab栏（App形态） ===== */
.tabbar { display:none; position:fixed; bottom:0; left:0; right:0; height:58px; background:#fff; border-top:1px solid var(--border); z-index:60; padding-bottom:env(safe-area-inset-bottom); box-shadow:0 -2px 12px rgba(0,0,0,.06); }
.tabbar .tabs { display:flex; height:58px; }
.tabbar .tb { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:none; border:none; font-size:10px; color:var(--text-2); cursor:pointer; padding:4px 0; }
.tabbar .tb .ic { font-size:20px; line-height:1; }
.tabbar .tb.on { color:var(--sidebar-bg); font-weight:700; }
.tabbar .tb .bdg { position:absolute; top:6px; right:calc(50% - 22px); background:#e05c5c; color:#fff; font-size:9px; font-weight:700; border-radius:8px; padding:0 5px; min-width:15px; height:15px; line-height:15px; }
.tabbar .tb { position:relative; }

@media (max-width:768px) {
  .sidebar { transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; }
  .menu-btn { display:block; }
  .scroll { padding:14px; padding-bottom:86px; }
  .video-grid,.kb-grid { grid-template-columns:1fr; }
  .title-card { flex-direction:column; text-align:center; }
  .title-card .t-tag { align-self:center; }
  .tabbar { display:block; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="profile">
      <div class="avatar">🌾</div>
      <div>
        <div class="profile-name">观粟主理人</div>
        <div class="profile-sub">谷物艺术中心 · 宁化</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">数据存于本机浏览器</div>
  </aside>
  <div class="overlay" id="overlay" onclick="toggleSide()"></div>
  <main class="main">
    <header class="main-header">
      <button class="menu-btn" onclick="toggleSide()">☰</button>
      <div class="breadcrumb">
        <span class="back-arr">‹</span>
        <span class="h-title" id="pageTitle">今日总览</span>
        <span class="h-sub" id="headerDate"></span>
      </div>
      <div class="header-tools">
        <button class="h-btn" title="搜索" onclick="toast('搜索：当前模块内查找。后续可加全局搜索')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="h-btn" title="分享" onclick="copyText(window.location.href);toast('已复制当前页面链接 ✓')">

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),1600); }

function dayNumOf(key){ if(!S.startDate) return null; const [y,m,dd]=key.split('-').map(Number); const cur=new Date(y,m-1,dd); const [sy,sm,sd]=S.startDate.split('-').map(Number); const st=new Date(sy,sm-1,sd); const diff=Math.round((cur-st)/86400000)+1; return (diff>=1&&diff<=28)?diff:null; }

// ================= 每日工作日报（发给AI对接） =================
function genDailyReport(preview){
  const pd=planDay(), tk=todayKey();
  const V=VIDEO_THEMES[wrapDay(pd)-1], T=TEA_DAILY[wrapDay(pd)-1], E=ENG_DAILY[wrapDay(pd)-1], F=FIT_PLAN[wrapDay(pd)-1];
  let items=[];
  T.tasks.forEach((t,i)=>items.push({text:`擂茶：${t}`, done:!!S.teaDaily[pd+'-'+i]}));
  items.push({text:`短视频：《${V.theme}》(${V.biz})`, done:!!S.video[pd]});
  items.push({text:`健身：${F.type}（${F.min}分钟）`, done:!!S.fit[pd]});
  items.push({text:`英语3句：${E.topic}`, done:!!S.eng[pd]});
  items.push({text:`民宿清单（8项）`, done:(S.bnb[tk]||[]).length>=BNB_CHECKLIST.length});
  (S.tasks[tk]||[]).forEach(t=>items.push({text:`${t.cat}：${t.text}`, done:t.done}));
  const done=items.filter(x=>x.done), notDone=items.filter(x=>!x.done);
  const left=[];
  Object.keys(S.tasks).forEach(k=>{ if(k<tk) (S.tasks[k]||[]).forEach(t=>{ if(!t.done) left.push(`${k.slice(5).replace('-','/')} ${t.text}`); }); });
  const tmrKey=tomorrowKey(); const tmrN=wrapDay(pd+1); const T2=TEA_DAILY[tmrN-1];
  const tmrTop=[`短视频：《${VIDEO_THEMES[tmrN-1].theme}》`, ...T2.tasks.slice(0,2), ...(S.tasks[tmrKey]||[]).map(t=>t.text)];
  const w=S.weights[pd];
  const txt=
`【观粟工作台日报 ${tk} · 28天计划第${pd}天】

✅ 今日完成（${done.length}项）：
${done.map(x=>'· '+x.text).join('\n')||'· 无'}

❌ 今日未完成（${notDone.length}项）：
${notDone.map(x=>'· '+x.text).join('\n')||'· 无，今天全清 🎉'}

${left.length?`📦 历史遗留（${left.length}项，需要顺延）：
${left.map(x=>'· '+x).join('\n')}

`:''}——
📊 民宿清单：${(S.bnb[tk]||[]).length}/8${w?` · 当前体重：${w}斤（目标116）`:''}

🎯 明日重点预告：
${tmrTop.slice(0,5).map(x=>'· '+x).join('\n')}

——
请帮我：① 检查未完成项的原因和补救 ② 提醒我明早优先处理什么 ③ 把遗留任务排出顺延计划`;

  copyText(txt);
  toast('日报已复制 → 去 WorkBuddy 对话粘贴发送');
}
const CMDS = [
  { t:'1️⃣ 生成今天全部待办', s:'四大类完整清单', full:'我是宁化谷物艺术中心（观粟民宿）主理人，业务含：民宿运营、短视频日更、客家擂茶伴手礼开发、自酿米酒。请生成我今天全部待办清单，按民宿工作/短视频/擂茶产品/个人生活（健身英语）分类，条理清晰、可执行、有优先级。' },

let addCat = '';
function renderTask(pd, tk){
  const yk = yestKey(); const tmk = tomorrowKey();

  const allOld = [];

  const group = (title, arr, k) => `
    <div class="date-group-t">${title}<span class="cnt">${arr.length} 项</span></div>
    ${arr.length?arr.map(t=>`
      <div class="task-item ${t.done?'done':''}">
        <div class="pr-check ${t.done?'on':''}" onclick="taskToggle('${t.id}','${k||t._k}')">✓</div>
        <div style="flex:1">
          <div class="tk-text">${esc(t.text)}</div>
          <div class="tk-meta"><span class="tk-cat" style="background:${catColor(t.cat)}">${t.cat}</span> <span class="pr-badge ${t.level}" style="margin-left:4px">${t.level}</span>${t._k?` <span style="margin-left:4px">${t._k.slice(5).replace('-','/')}</span>`:''}</div>
        </div>
        <button class="btn ghost sm" onclick="postpone('${t.id}','${k||t._k}')">顺延</button>
      </div>`).join(''):'<div class="desc" style="padding:6px 4px">暂无任务</div>'}`;

  $('#view').innerHTML = `
  <div class="title-card">
    <div class="ic-box">📅</div>
    <div class="t-info">
      <h2>日程 · 备忘</h2>
      <p>口述即录入 · 自动归类 · 遗留自动顺延 · 次日必做清单</p>

  </div>
  <div class="quote-band">📌 昨天没做完的不用慌：点「顺延」自动挪到明天；明天要做的事，提前一天列好，早上起来直接执行。</div>
  <div class="card">
    <div class="card-t"><span class="lft">➕ 新增任务 / 备忘</span></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <input type="text" id="ntText" style="flex:1;min-width:200px" placeholder="口述一件事，如：明天拍擂茶包装打样、采购芝麻5斤、修二楼花洒…" onkeydown="if(event.key==='Enter')addTask()">
      <select id="ntLevel"><option value="P0">P0 紧急</option><option value="P1" selected>P1 重要</option><option value="P2">P2 一般</option></select>
      <select id="ntCat"><option value="">自动分类</option><option value="民宿运营">民宿运营</option><option value="短视频">短视频</option><option value="擂茶产品">擂茶产品</option><option value="米酒运营">米酒运营</option><option value="个人生活">个人生活</option></select>
      <select id="ntDate"><option value="today" selected>今天</option><option value="tomorrow">明天</option><option value="future">以后</option></select>
      <button class="btn" onclick="addTask()">添加</button>
    </div>
    <div class="desc" style="margin-top:8px">输入内容含"擂茶/拍/房间/米酒/健身"等关键词会<b>自动归类</b>对应模块</div>
  </div>

  ${allOld.length||yTasks.length?`<div class="card" style="border:1px solid #f5c6c6">${group('⚠️ 遗留未完成（点击顺延到明天）', allOld.length?allOld:yTasks, '')}</div>`:''}
  <div class="card">${group('📌 今天', tT, tk)}${group('🔜 明天（次日必做）', tTm, tmk)}${group('🗂️ 以后', tF, '')}</div>

  <div class="card">
    <div class="card-t"><span class="lft">📝 备忘录（随手记 · 自动保存）</span></div>
    <textarea id="memoBox" rows="6" placeholder="采购：芝麻5斤、牛皮纸袋…&#10;对接：文旅局小林、印刷厂老王…&#10;维修：二楼花洒、咖啡机除垢…" oninput="saveMemo(this.value)">${esc(S.memo)}</textarea>
  </div>`;
}
function saveMemo(v){ S.memo = v; save(); }
function addTask(){
  const text = $('#ntText').value.trim(); if(!text) return toast('请输入内容');
  const level = $('#ntLevel').value;
  const catSel = $('#ntCat').value;
  const cat = catSel || autoCat(text);
  const dsel = $('#ntDate').value;
  const k = dsel==='today'?todayKey():dsel==='tomorrow'?tomorrowKey():'2999-12-31';
  if(!S.tasks[k]) S.tasks[k]=[];
  S.tasks[k].push({ id:'t'+Date.now(), text, cat, level, done:false });
  save(); toast(`已归类「${cat}」✓`); render();
}
function taskToggle(id, k){
  const t=(S.tasks[k]||[]).find(x=>x.id===id); if(!t) return; t.done=!t.done; save(); render();
}
function postpone(id, k){
  const k2 = k || Object.keys(S.tasks).find(key=>(S.tasks[key]||[]).some(x=>x.id===id));
  const t=(S.tasks[k2]||[]).find(x=>x.id===id); if(!t) return;
  const tk=tomorrowKey(); if(!S.tasks[tk]) S.tasks[tk]=[];
  S.tasks[tk].push(t); S.tasks[k2]=S.tasks[k2].filter(x=>x.id!==id);
  save(); toast('已顺延到明天 ✓'); render();
}

    <div style="display:flex;gap:10px;margin-bottom:12px">
      <input type="number" step="0.1" id="wIn" placeholder="记录今日体重（斤）" style="flex:1">
      <button class="btn sm" onclick="saveW()">记录</button>
    </div>
    <canvas id="wChart" style="width:100%;height:170px"></canvas>
    <div class="path" style="margin-top:12px">${FIT_PLAN.map(f=>`<div class="p ${S.fit[f.day]?'done':''} ${f.day===d?'cur':''}" title="${esc(f.type)}" onclick="fitJump(${f.day})">${f.day}</div>`).join('')}</div>

function fitToggle(d){ if(S.fit[d]) delete S.fit[d]; else S.fit[d]=true; save(); render(); }
function fitJump(){ toast('按日期顺序推进即可，无需跳转'); }
function saveW(){ const v=parseFloat($('#wIn').value); if(!v||v<80||v>250) return toast('请输入合理体重'); const k=prompt('记录到第几天？（默认今天第'+planDay()+'天）',''); const d=parseInt(k)||planDay(); S.weights[d]=v; save(); toast('体重已记录 ✓'); render(); }
function drawW(){
  const cv=$('#wChart'); if(!cv) return;
  const w=cv.clientWidth||600,h=170,dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
  const ws=Object.keys(S.weights).map(Number).sort((a,b)=>a-b).map(k=>({d:k,w:S.weights[k]}));
  const vals=[...ws.map(x=>x.w), ...(S.weight0?[S.weight0]:[]), 116];
  let mn=Math.min(...vals)-1, mx=Math.max(...vals)+1; if(mx-mn<6){mx=mn+6;}
  const padL=36,padR=10,padT=12,padB=20;
  const X=d2=>padL+(d2-1)/27*(w-padL-padR), Y=v=>padT+(mx-v)/(mx-mn)*(h-padT-padB);
  ctx.font='10px sans-serif'; ctx.textAlign='right';
  for(let g=Math.ceil(mn);g<=Math.floor(mx);g++){ ctx.strokeStyle='#eef2ef'; ctx.beginPath(); ctx.moveTo(padL,Y(g)); ctx.lineTo(w-padR,Y(g)); ctx.stroke(); ctx.fillStyle='#adb8b0'; ctx.fillText(g,padL-4,Y(g)+3); }
  ctx.strokeStyle='#f0a500'; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(padL,Y(116)); ctx.lineTo(w-padR,Y(116)); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#f0a500'; ctx.textAlign='left'; ctx.fillText('目标116',padL+2,Y(116)-4);
  ctx.fillStyle='#adb8b0'; ctx.textAlign='center'; [1,7,14,21,28].forEach(d2=>ctx.fillText('D'+d2,X(d2),h-6));
  if(!ws.length) return;
  ctx.strokeStyle='#4caf7f'; ctx.lineWidth=2.5; ctx.beginPath();
  ws.forEach((e,i)=>{ const x=X(e.d),y=Y(e.w); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ws.forEach(e=>{ ctx.beginPath(); ctx.arc(X(e.d),Y(e.w),3.5,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#4caf7f'; ctx.lineWidth=2; ctx.stroke(); });
}

// ================= 引导 =================
function finishOb(){
  S.startDate=$('#obDate').value||todayISO();
  const w=parseFloat($('#obWeight').value); if(w) { S.weight0=w; S.weights[planDay()]=w; }
  save(); $('#obModal').classList.add('hide'); toast('工作台已开启 🌾'); render();
}

// ================= 分类色 =================
function catColor(c){
  return ({ '擂茶产品':'var(--c-tea)','短视频':'var(--c-video)','民宿运营':'var(--c-bnb)','米酒运营':'var(--c-wine)','个人生活':'var(--c-life)' })[c]||'#95a5a6';
}

// ================= PWA 注册（仅 HTTPS / localhost） =================
if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw-studio.js').catch(()=>{});
  });
}

// ================= 手机底部Tab =================
function renderTab(){
  const tNotDone = ((S.tasks[todayKey()]||[]).filter(t=>!t.done)).length + ((S.tasks[yestKey()]||[]).filter(t=>!t.done)).length;
  const tabs = [
    { key:'dash', ic:'🏠', label:'今日', badge:0 },
    { key:'tea',  ic:'🍵', label:'擂茶', badge:0 },
    { key:'task', ic:'📅', label:'任务', badge:tNotDone },
    { key:'more', ic:'☰', label:'更多', badge:0 },
  ];
  $('#tabbar').innerHTML = tabs.map(t=>t.key==='more'
    ? `<button class="tb" onclick="toggleSide()"><span class="ic">${t.ic}</span>${t.label}</button>`
    : `<button class="tb ${curView===t.key?'on':''}" onclick="go('${t.key}')"><span class="ic">${t.ic}</span>${t.label}${t.badge?`<span class="bdg">${t.badge}</span>`:''}</button>`
  ).join('');
}

// ================= 启动 =================
(function(){
  const p=new URLSearchParams(location.search);
  if(!S.startDate&&p.get('start')){ S.startDate=p.get('start'); const w=parseFloat(p.get('weight')); if(w){S.weight0=w;S.weights[1]=w;} save(); }
  if(!S.startDate){ $('#obDate').value=todayISO(); } else { $('#obModal').classList.add('hide'); }
  const n=new Date(); const wk=['日','一','二','三','四','五','六'];
  $('#headerDate').textContent=`${n.getFullYear()}年${n.getMonth()+1}月${n.getDate()}日 星期${wk[n.getDay()]}`;
  const qv=p.get('view'); if(qv&&VIEWS.some(v=>v.key===qv)) curView=qv;
  renderNav(); renderTab(); $('#pageTitle').textContent=VIEWS.find(v=>v.key===curView).label; render();
})();
</script>
</body>
</html>
